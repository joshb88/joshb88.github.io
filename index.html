<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Statistics Projects | Josh Boehm</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f7fa; color: #172b45; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }

    .card { display: flex; flex-direction: column; padding: 32px; background: #fff; border: 1px solid #d9e1eb; border-radius: 16px; color: inherit; text-decoration: none; box-shadow: 0 4px 16px #172b4508; }

    .course { color: #245da8; font-weight: 750; letter-spacing: .04em; }
    h2 { margin: 16px 0 24px; font-size: 1.5rem; line-height: 1.35; }
    .open { margin-top: auto; color: #245da8; font-weight: 650; }
    footer { margin-top: 40px; color: #52647b; font-size: .9rem; }
    @media (max-width: 600px) { main { padding: 48px 20px; } nav { grid-template-columns: 1fr; } .card { padding: 24px; } }

        <span class="open">View project &rarr;</span>
